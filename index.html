<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barcode - QR Code Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" id="top">
        <div class="mode-switch" aria-label="Generator type">
          <button class="nav-item active" data-mode="barcode"><span class="nav-icon">▥</span>Barcode <span class="pill">128</span></button>
          <button class="nav-item" data-mode="qr"><span class="nav-icon">⊞</span>QR code</button>
        </div>

        <div class="content-grid">
          <section class="preview-panel" aria-label="Live preview">
            <div class="preview-topline"><span>LIVE PREVIEW</span><span id="previewType">CODE 128</span></div>
            <div class="code-card">
              <div id="emptyState" class="empty-state hidden">Enter text to generate</div>
              <svg id="barcode"></svg>
              <div id="qrcode" class="hidden"></div>
            </div>
            <p class="scan-note" id="scanNote">Optimized for retail, inventory and asset labels.</p>
          </section>
          <section class="controls" aria-label="Generator controls">
            <label for="codeInput">Content</label>
            <div class="input-wrap">
              <input id="codeInput" type="text" value="" maxlength="160" autocomplete="off" />
              <span class="counter"><span id="charCount">16</span>/160</span>
            </div>
            <p class="field-hint" id="fieldHint">Letters, numbers, and symbols all work with Code 128.</p>

            <div class="customize-heading"><span>Customize</span><span></span></div>
            <div class="options barcode-options">
              <label class="option-label" for="lineWidth">Line width <output id="widthValue">2</output></label>
              <input id="lineWidth" type="range" min="1" max="4" value="2" />
              <div class="option-row"><label for="showText">Show text</label><input id="showText" class="switch" type="checkbox" checked /></div>
            </div>
            <div class="options qr-options hidden">
              <label class="option-label" for="qrSize">Code size <output id="sizeValue">260px</output></label>
              <input id="qrSize" type="range" min="180" max="360" step="10" value="260" />
              <div class="option-row"><label for="qrLevel">Error correction</label><select id="qrLevel"><option value="L">Low</option><option value="M" selected>Medium</option><option value="Q">Quartile</option><option value="H">High</option></select></div>
            </div>
          </section>
        </div>
      </section>
      <div class="actions">
        <button id="copyButton" class="secondary-button">Copy value</button>
        <button id="downloadButton" class="primary-button">Download <span>↓</span></button>
      </div>
      <nav class="bottom-nav" aria-label="App navigation"><button class="bottom-nav-item active"><span>⌁</span>Generate</button><button class="bottom-nav-item"><span>◷</span>History</button></nav>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
